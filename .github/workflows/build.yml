name: Build ClawChat APK

on:
  push:
    branches: [master, develop, feat/claw-integration]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Library compile sanity check
        run: ./gradlew :TMessagesProj:compileDebugJavaWithJavac --warning-mode=none --no-daemon

      - name: Build Standalone Debug APK
        run: ./gradlew :TMessagesProj_AppStandalone:assembleStandalone --warning-mode=none --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: clawchat-debug
          path: TMessagesProj_AppStandalone/build/outputs/apk/**/*.apk
          retention-days: 14
